<audio id="sfxBeepBeep" src="sounds/BEEPBEEP.wav" preload="auto" style="display:none"></audio>
<audio id="sfxEbitda" src="sounds/EBITDA.wav" preload="auto" style="display:none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
<style>
#muteBtn {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 1000;
  background: #FFC425;
  color: #242424;
  border: 2px solid #242424;
  padding: 6px 14px;
  font-family: 'industry', 'Arial Black', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 2px;
  letter-spacing: 0.05em;
}
#muteBtn:hover { background: #FFDB6E; }
</style>
<button id="muteBtn" onclick="toggleMute()" tabindex="-1">🔇 MUSIC</button>
<script>
  const music   = document.getElementById('bgMusic');
  const muteBtn = document.getElementById('muteBtn');
  music.volume = 0.5;

  // Storage is unavailable in some privacy modes, and this runs before the game boots.
  const readPref  = () => { try { return localStorage.getItem('wm_music'); } catch { return null; } };
  const writePref = v  => { try { localStorage.setItem('wm_music', v); } catch {} };

  // Restore the saved preference. Autoplay is blocked until a user gesture, so only the flag and
  // the label are restored here; playback starts on the first interaction below.
  music.muted = readPref() !== 'on';
  muteBtn.textContent = music.muted ? '🔇 MUSIC' : '🔊 MUSIC';

  function toggleMute() {
    music.muted = !music.muted;
    writePref(music.muted ? 'off' : 'on');
    muteBtn.textContent = music.muted ? '🔇 MUSIC' : '🔊 MUSIC';
    music.play().catch(() => {});
    // A clicked <button> keeps DOM focus, and a focused button fires on Space and Enter, so from
    // the first click on, every Space or Enter during play toggled the music. Drop focus at once.
    muteBtn.blur();
  }

  // M is the only keyboard shortcut for music. It stands down while the initials screen is up,
  // where M is a letter the player may want to type.
  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyM' && !window.__typingInitials) toggleMute();
  });

  // Saved preference was 'on': start playing as soon as a gesture allows it.
  window.addEventListener('pointerdown', () => {
    if (!music.muted) music.play().catch(() => {});
  }, { once: true });
</script>
<script>
// ============================================================
//  CONSTANTS — tweak these to tune the game
// ============================================================
const C = {
  WIDTH:           960,
  HEIGHT:          640,
  GRAVITY:         800,
  POOP_COOLDOWN:   1500,   // ms between throws
  POOP_SPEED:      520,
  SPAWN_RATE_BASE: 3000,   // ms between enemy spawns (decreases over time)
  FAN_THRESHOLD:   1000,   // score points to charge the fan

  // One shared palette for every texture, each ramp dark to light. INK doubles as the outline colour.
  PAL: {
    INK:      0x111118,
    GREY_1:   0x2A2A34,
    GREY_2:   0x444454,
    GREY_3:   0x5C5C70,
    GREY_4:   0x888898,
    GREY_5:   0xAABBCC,
    GREY_6:   0xCCCCDD,
    WHITE:    0xFCFCFC,
    NAVY:     0x283050,   // ceiling
    BLUE_D:   0x1A3090,
    BLUE:     0x3050C0,
    SKY:      0x99CCFF,
    SKY_L:    0xCCEEFF,
    YEL_DD:   0x8A6C00,
    YEL_D:    0xCC9000,
    YEL:      0xFFC425,   // hazard / Big Ass Fans yellow
    YEL_L:    0xFFE066,
    CREAM:    0xFFFACC,
    ORANGE_D: 0xCC4400,
    ORANGE:   0xFF6600,
    ORANGE_L: 0xFFAA00,
    RED:      0xCC0000,
    RED_L:    0xFF4444,
    BROWN_0:  0x3A1C08,
    BROWN_1:  0x5C3010,
    BROWN_2:  0x7B4018,
    BROWN_3:  0xA86828,
    TAN_D:    0xC07840,
    TAN:      0xD8A048,
    KHAKI:    0xC8A96E,
    SKIN_D:   0xCC9966,
    SKIN:     0xFFCCA0,
  }
};

// ============================================================
//  NETLIFY DB — LEADERBOARD HELPERS
// ============================================================
async function submitScore(initials, score) {
  try {
    const res = await fetch('/.netlify/functions/submit-score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initials: initials.toUpperCase(), score })
    });
    return res.ok;
  } catch { return false; }
}

async function fetchTopScores() {
  try {
    const res = await fetch('/.netlify/functions/get-scores');
    if (!res.ok) return [];
    return await res.json();
  } catch { return []; }
}

// ============================================================
//  BOOT SCENE — generates all textures programmatically
// ============================================================

// Draw a pixel rect on a graphics object.
const px = (g, col, x, y, w, h) => { g.fillStyle(col, 1); g.fillRect(x, y, w, h); };
const P = C.PAL;

// Paint a pixel grid at ox: rows of chars, key maps a char to a colour (null = transparent).
const paintGrid = (g, rows, key, ox = 0) => rows.forEach((row, y) =>
  [...row].forEach((ch, x) => { const col = key[ch]; if (col != null) px(g, col, ox + x, y, 1, 1); }));

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  preload() {
    this.load.image('baf_logo', 'images/BAF.png');
  }

  create() {
    this.makeWarehouseBackground();
    this.makeChimpTextures();
    this.makePlatformTextures();
    this.makePoopTextures();
    this.makeEnemyTextures();
    this.makeFanTextures();
    this.makeUITextures();
    this.scene.start('Title');
  }

  makeWarehouseBackground() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    // Painted on a 480x320 grid and shown at 2x, so every pixel here is a 2x2 block on screen.
    const r = (c, x, y, w, h) => px(g, c, x, y, w, h);

    // ── Ceiling: dark deck with steel trusses
    r(P.GREY_1, 0, 0, 480, 34);
    for (let x = 0; x < 480; x += 6) r(P.INK, x, 0, 3, 10);          // corrugated deck
    r(P.INK, 0, 10, 480, 2);
    r(P.GREY_2, 0, 24, 480, 2);                                      // truss bottom chord
    r(P.GREY_2, 0, 12, 480, 1);                                      // top chord
    for (let x = 0; x < 480; x += 24) {                              // truss zig-zag
      for (let i = 0; i < 12; i++) { r(P.GREY_2, x + i, 12 + i, 1, 1); r(P.GREY_2, x + 23 - i, 12 + i, 1, 1); }
    }
    r(P.INK, 0, 26, 480, 2);
    r(P.GREY_1, 0, 28, 480, 6);

    // ── Wall: corrugated metal cladding
    const WT = 34, WB = 288;
    r(P.GREY_2, 0, WT, 480, WB - WT);
    for (let x = 0; x < 480; x += 8) {                               // ribs: light edge, dark valley
      r(P.GREY_3, x, WT, 1, 216);
      r(P.GREY_1, x + 5, WT, 1, 216);
    }
    r(P.GREY_1, 0, WT, 480, 4);                                      // darker under the ceiling
    for (const y of [96, 172]) { r(P.GREY_1, 0, y, 480, 2); r(P.GREY_3, 0, y + 2, 480, 1); }

    // Block wainscot with a safety band along the bottom of the wall
    r(P.GREY_2, 0, 250, 480, 38);
    for (let y = 256; y < 288; y += 8) {
      r(P.GREY_1, 0, y, 480, 1);
      const off = (y / 8) % 2 ? 0 : 12;
      for (let x = off; x < 480; x += 24) r(P.GREY_1, x, y, 1, 8);
    }
    r(P.YEL_DD, 0, 250, 480, 3);
    r(P.GREY_1, 0, 253, 480, 1);

    // ── Wall lamps: warm pools on the cladding
    for (const lx of [150, 350]) {
      for (let i = 0; i < 40; i += 2) {                              // short wide cone: lit flats, bright ribs
        const halfW = 6 + Math.floor(i * 0.8);
        for (let x = lx - halfW; x < lx + halfW; x++) {
          const m = ((x % 8) + 8) % 8;
          if (m === 5) continue;
          r(m === 0 ? P.GREY_4 : P.GREY_3, x, 54 + i, 1, 2);
        }
      }
      r(P.GREY_1, lx - 1, 46, 2, 3);                                 // bracket from pipe
      r(P.GREY_1, lx - 8, 49, 16, 3);                                // lamp housing
      r(P.GREY_3, lx - 7, 50, 14, 1);
      r(P.YEL_L, lx - 5, 52, 10, 2);                                 // lens
    }

    // ── Pipes along the top of the wall
    r(P.GREY_1, 0, 46, 480, 1);
    r(P.GREY_3, 0, 40, 480, 5);
    r(P.GREY_4, 0, 41, 480, 1);
    r(P.GREY_1, 0, 45, 480, 1);
    for (let x = 20; x < 480; x += 64) { r(P.GREY_1, x, 39, 3, 7); } // brackets
    r(P.GREY_3, 355, 45, 3, 205);                                    // conduit down the right gap
    r(P.GREY_4, 355, 45, 1, 205);
    r(P.GREY_1, 352, 120, 9, 4);
    r(P.GREY_1, 352, 210, 9, 4);

    // ── Roller door in the left-centre gap
    const dx = 140, dw = 78, dy = 150;
    r(P.GREY_1, dx - 4, dy - 8, dw + 8, WB - dy + 8);                // frame
    r(P.BROWN_0, dx - 4, dy - 8, dw + 8, 6);                         // header box
    r(P.GREY_3, dx, dy, dw, WB - dy);
    for (let y = dy; y < WB; y += 5) { r(P.GREY_4, dx, y, dw, 1); r(P.GREY_2, dx, y + 4, dw, 1); }
    r(P.YEL_DD, dx - 4, dy - 2, 3, WB - dy + 2);                     // hazard posts
    r(P.YEL_DD, dx + dw + 1, dy - 2, 3, WB - dy + 2);
    for (let y = dy; y < WB; y += 8) { r(P.GREY_1, dx - 4, y, 3, 3); r(P.GREY_1, dx + dw + 1, y, 3, 3); }
    r(P.INK, dx, WB - 3, dw, 3);                                     // gap under door

    // Sign above the door
    const font = {
      D: ['110','101','101','101','110'], O: ['111','101','101','101','111'],
      C: ['111','100','100','100','111'], K: ['101','110','100','110','101'],
      '2': ['111','001','111','100','111'],
    };
    const text = (s, x, y, c) => {
      for (const ch of s) {
        if (ch !== ' ') font[ch].forEach((row, j) => { for (let i = 0; i < 3; i++) if (row[i] === '1') r(c, x + i, y + j, 1, 1); });
        x += 4;
      }
    };
    r(P.GREY_3, dx + 21, 124, 36, 11);
    r(P.YEL_DD, dx + 21, 134, 36, 1);
    text('DOCK 2', dx + 28, 127, P.GREY_1);

    // Fire extinguisher in the right-hand gap
    r(P.RED, 364, 222, 6, 14);
    r(P.ORANGE_D, 365, 223, 1, 12);
    r(P.GREY_1, 365, 219, 4, 3);
    r(P.GREY_1, 362, 236, 10, 2);

    // ── Floor: polished concrete
    r(P.GREY_3, 0, 288, 480, 32);
    r(P.GREY_4, 0, 288, 480, 1);                                     // top lip
    r(P.GREY_2, 0, 289, 480, 2);                                     // wall shadow on floor
    r(P.YEL_DD, 0, 296, 480, 2);                                     // safety lane line
    for (let x = -40; x < 520; x += 60) {                            // expansion joints
      for (let y = 298; y < 320; y++) r(P.GREY_2, x + Math.floor((x - 240) * (y - 298) / 90), y, 1, 1);
    }
    r(P.GREY_2, 0, 309, 480, 1);
    for (const lx of [150, 350]) { r(P.GREY_4, lx - 20, 302, 40, 1); r(P.GREY_4, lx - 12, 304, 24, 1); }
    for (const [sx, sy] of [[40, 313], [90, 301], [260, 315], [300, 305], [430, 311]]) r(P.GREY_2, sx, sy, 6, 1);
    r(P.GREY_2, 0, 318, 480, 2);

    g.generateTexture('background', 480, 320);
    g.destroy();
  }

  makeChimpTextures() {
    // Sprite canvas: 28 wide x 44 tall per frame (drawn with 6px top padding for hat dome)
    // Frames: 0=idle, 1=walk_a, 2=walk_b, 3=jump
    const FW = 28, FH = 44;
    const frames = 4;
    const g = this.make.graphics({ add: false });
    const px = (col, x, y, w, h) => { g.fillStyle(col, 1); g.fillRect(x, y, w, h); };

    // One char per pixel. k is the outline, h/y/d/D the hat and vest yellows, f/b/n/o the fur,
    // t/T skin, w/g/G the vest strips and eyes, m/r the mouth.
    const KEY = {
      '.': null, k: P.INK,
      h: P.YEL_L, y: P.YEL, d: P.YEL_D, D: P.YEL_DD,
      f: P.BROWN_3, b: P.BROWN_2, n: P.BROWN_1, o: P.BROWN_0,
      t: P.TAN, T: P.TAN_D,
      w: P.WHITE, g: P.GREY_6, G: P.GREY_5,
      m: P.RED, r: P.RED_L,
    };

    // Head rows 0-19, torso rows 20-31, legs rows 32-43. Torso and leg rows are a left half
    // plus a right half of 14 chars each, so poses swap one side without redrawing the other.
    const HEAD = [
      '..........kkkkkkkk..........',
      '........kkhhhhyyyykk........',
      '.......khhyyyyyyyyydk.......',
      '......khyyyyyyyyyyyydk......',
      '.....khyyyyyyyyyyyyyddk.....',
      '.....khyyyyyyyyyyyydddk.....',
      '..khhhhyyyyyyyyyyyyyyyyydk..',
      '...kddddddddddddddddddddk...',
      '....kknnnnnnnnnnnnnnnnkk....',
      '.....kfbbbbbbbbbbbbbbnk.....',
      '.....kbooooobbbbooooonk.....',
      '..kkkkbowwwottttowwwonkkkk..',
      '.kbtTnbwwkkwttttwwkkwnntTnk.',
      '.kbtTnbwwkkwttttwwkkwnntTnk.',
      '.knTTnbtwwwttttttwwwtnnTTnk.',
      '..knnnb' + 'tttttottottttt' + 'bnnnk..',
      '...kknbtkttttttttttktbnkk...',
      '.....knTkwwwwwwwwwwkTnk.....',
      '.....knTTkmrrrrrrmkTTnk.....',
      '......knTTkkkkkkkkTTnk......',
    ];

    const E = '..............';
    const half  = pairs => pairs.map(([l, r]) => l + r);
    const zip   = (L, R) => L.map((l, i) => [l, R[i]]);
    const patch = (row, col, s) => row.slice(0, col) + s + row.slice(col + s.length);

    // Vest band (V) with white and grey reflective strips (S1, S2).
    const V  = ['...kfbnhyyyyyy', 'yyyyydDbnnk...'];
    const S1 = ['...kfbnwwwwwww', 'wwwwwggbnnk...'];
    const S2 = ['...kfbnggggggg', 'gggggGGbnnk...'];
    const TOP = [
      ['....kkkkkkkkkk', 'kkkkkkkkkk....'],
      ['...kfbnhhyyyyy', 'yyyyydDbnnk...'],
      V, V, S1, S2, V, V, S1, S2, V,
      ['...kfbnddddddd', 'ddddddDbnnk...'],
    ];

    const idleL = ['...kttTknnnnnn', '....kkkkfbbbbb', '.......kfbbnkk', '.......kfbbnk.', '.......kfbbnk.', '.......kfbbnk.',
      '....kkknbbbnk.', '...kfbbbbbbnk.', '...knnnnnnnnk.', '....kkkkkkkkk.', E, E];
    const idleR = ['nnnnnnktTTk...', 'bnnnnnkkkk....', 'kkbbnnknnk....', '.kbbnnkknnk...', '.kbbnnk.knnk..', '.kbbnnk..kkk..',
      '.kbbnnnkkk....', '.kbbnnnnnnk...', '.knnnnnnnnk...', '.kkkkkkkkk....', E, E];
    const idle = [...HEAD, ...half(TOP), ...half(zip(idleL, idleR))];

    // walkA raises the left arm and lifts the left foot; walkB mirrors it.
    const walkA = [...HEAD, ...half([
      ...TOP.slice(0, 8),
      ['...kttTwwwwwww', S1[1]],
      ['...kTTTggggggg', S2[1]],
      ['....kkkhyyyyyy', V[1]],
      ['......kddddddd', TOP[11][1]],
      ['......kknnnnnn', 'nnnnnnkbnnk...'],
      ['.......kfbbbbb', 'bnnnnnktTTk...'],
      ['.......kfbbnkk', 'kkbbnnktTTk...'],
      ['.......kfbbnk.', '.kbbnnkkkk....'],
      ['.....kkkbbbnk.', '.kbbnnkknnk...'],
      ['...kfbbbbbbnk.', '.kbbnnk.knnk..'],
      ['...knnnnnnnnk.', '.kbbnnnkkkkk..'],
      ['....kkkkkkkkk.', idleR[7]],
      [E, idleR[8]],
      [E, idleR[9]],
      [E, E], [E, E],
    ])];
    const walkB = [...HEAD, ...half([
      ...TOP.slice(0, 8),
      [S1[0], 'wwwwwggtTTk...'],
      [S2[0], 'gggggGGTTTk...'],
      [V[0], 'yyyyydDkkk....'],
      [TOP[11][0], 'ddddddDk......'],
      ['...kfbnknnnnnn', 'nnnnnnk.......'],
      ['...kttTkfbbbbb', 'bnnnnnk.......'],
      ['...ktTTkfbbnkk', 'kkbbnnknnk....'],
      ['....kkkkfbbnk.', '.kbbnnkknnk...'],
      [idleL[4], '.kbbnnnkknnk..'],
      [idleL[5], '.kbbnnnnnnkk..'],
      [idleL[6], '.knnnnnnnnk...'],
      [idleL[7], '.kkkkkkkkk....'],
      [idleL[8], E],
      [idleL[9], E],
      [E, E], [E, E],
    ])];

    // jump: both fists up beside the jaw, legs tucked.
    const jHead = HEAD.slice();
    jHead[17] = patch(patch(jHead[17], 0, '.kk.'), 24, '.kk.');
    jHead[18] = patch(patch(jHead[18], 0, 'ktTk'), 24, 'ktTk');
    jHead[19] = patch(patch(jHead[19], 0, 'kTTk'), 24, 'kTTk');
    const jV  = ['......khyyyyyy', 'yyyyydDk......'];
    const jS1 = ['......kwwwwwww', 'wwwwwggk......'];
    const jS2 = ['......kggggggg', 'gggggGGk......'];
    const jump = [...jHead, ...half([
      ['.kfnkkkkkkkkkk', 'kkkkkkkkkkbnk.'],
      ['..kfbnnhyyyyyy', 'yyyyydDnbnnk..'],
      ['...kbnnhyyyyyy', 'yyyyydDnbnk...'],
      ['....kknhyyyyyy', 'yyyyydDnkk....'],
      jS1, jS2, jV, jV, jS1, jS2, jV,
      ['......kddddddd', 'ddddddDk......'],
      ['.......knnnnnn', 'nnnnnnknnk....'],
      ['.......kfbbbbb', 'bnnnnnkknnk...'],
      ['......kfbbbnkk', 'kkbbbnnk.kkk..'],
      ['.....kfbbbnk..', '..kbbbnnk.....'],
      ['....kfbbbbnk..', '..kbbbnnnk....'],
      ['....knnnnnnk..', '..knnnnnnk....'],
      ['.....kkkkkk...', '...kkkkkk.....'],
      [E, E], [E, E], [E, E], [E, E], [E, E],
    ])];

    [idle, walkA, walkB, jump].forEach((rows, i) => paintGrid(g, rows, KEY, i * FW));

    g.generateTexture('chimp', FW * frames, FH);
    g.destroy();

    // Register spritesheet frames manually
    this.textures.get('chimp').add(0, 0, 0,       0, FW, FH);
    this.textures.get('chimp').add(1, 0, FW,      0, FW, FH);
    this.textures.get('chimp').add(2, 0, FW * 2,  0, FW, FH);
    this.textures.get('chimp').add(3, 0, FW * 3,  0, FW, FH);

    this.anims.create({
      key: 'chimp_idle',
      frames: [{ key: 'chimp', frame: 0 }],
      frameRate: 1, repeat: -1
    });
    this.anims.create({
      key: 'chimp_walk',
      frames: [{ key: 'chimp', frame: 1 }, { key: 'chimp', frame: 2 }],
      frameRate: 8, repeat: -1
    });
    this.anims.create({
      key: 'chimp_jump',
      frames: [{ key: 'chimp', frame: 3 }],
      frameRate: 1, repeat: -1
    });
  }

  makePoopTextures() {
    // ── Flying poop projectile (10x10) — three-tier swirl with a pointed tip
    {
      const KEY = { '.': null, k: P.INK, h: P.BROWN_3, b: P.BROWN_2, d: P.BROWN_1, D: P.BROWN_0 };
      const g = this.make.graphics({ add: false });
      paintGrid(g, [
        '...kkkk...',
        '...khbk...',
        '..khhbdk..',
        '.khhbbbdk.',
        '.kbbbbbdk.',
        '.kdddddDk.',
        'khhbbbbddk',
        'khbbbbbDDk',
        'kddddddDDk',
        '.kkkkkkkk.',
      ], KEY);
      g.generateTexture('poop', 10, 10);
      g.destroy();
    }

    // ── Splat (16x12) — wide lopsided mass with flung specks, left where a shot lands
    {
      const KEY = { '.': null, k: P.INK, h: P.BROWN_3, b: P.BROWN_2, d: P.BROWN_1 };
      const g = this.make.graphics({ add: false });
      paintGrid(g, [
        '.......b........',
        '......bb........',
        '.b...........b..',
        '.....kkkkkk.....',
        '..kkkhhbbbbkk...',
        '.khhhbbbbbbbdkk.',
        'khhbbbbbbbbbbddk',
        'khbbbbbbbbbbbddk',
        'kbbbbbbbbbbbdddk',
        '.kbbbbbbbbbddk..',
        '..kkdddddddkk...',
        '.b..kkkkkkk..b..',
      ], KEY);
      g.generateTexture('splat', 16, 12);
      g.destroy();
    }

    // ── Reticle (20x20) — four outlined arms with a gap, so the centre dot never hides the aim point
    {
      const KEY = { '.': null, k: P.INK, r: P.RED_L, R: P.RED };
      const g = this.make.graphics({ add: false });
      paintGrid(g, [
        '........kkkk........',
        '........krRk........',
        '........krRk........',
        '........krRk........',
        '........krRk........',
        '........krRk........',
        '........kkkk........',
        '....................',
        'kkkkkkk......kkkkkkk',
        'krrrrrk..rr..krrrrrk',
        'kRRRRRk..RR..kRRRRRk',
        'kkkkkkk......kkkkkkk',
        '....................',
        '........kkkk........',
        '........krRk........',
        '........krRk........',
        '........krRk........',
        '........krRk........',
        '........krRk........',
        '........kkkk........',
      ], KEY);
      g.generateTexture('reticle', 20, 20);
